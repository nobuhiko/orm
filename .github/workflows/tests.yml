# 元の Doctrine ORM 2.4 のテスト一式を、EC-CUBE 3.0.18 のお店が使う PHP 7.1 と 7.4 で回す。
# 同じテストを元のバージョン(v2.4.8)のライブラリでも回し、修正を移したことで新しく落ちたテストだけを失敗にする
# (時刻帯のデータや OpenSSL など、元のバージョンでも落ちるものは数えない。どちらも一覧には出す)。
# Runs the original Doctrine ORM 2.4 test suite on PHP 7.1 and 7.4 (what EC-CUBE 3.0.18 shops run), once with this
# fork and once with the upstream v2.4.8 library code, and fails only on tests that break because of the backports.
name: tests
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  phpunit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['7.1', '7.4']
    env:
      BASE: 5aedac1e5c5caaeac14798822c70325dc242d467 # v2.4.8
      SYMFONY_PHPUNIT_VERSION: '5.7'
      SYMFONY_DEPRECATIONS_HELPER: weak
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php }}
          tools: composer:v2
          extensions: pdo_sqlite, sqlite3
          coverage: none
      # require-dev は配布物から外してあるので、テストの道具だけここで入れる。
      # PHPUnit 5.7 には Packagist の弱点の情報が付いていて Composer が入れないので、テストのときだけ止めを外す
      - name: install test tools
        run: |
          rm -f composer.lock
          composer config audit.block-insecure false
          :
          composer require --dev --no-interaction --no-progress "phpunit/phpunit:^5.7" "symfony/yaml:~2.7" "doctrine/common:2.5.3" "doctrine/dbal:2.5.13" "doctrine/collections:1.3.0" "doctrine/cache:1.5.4" "doctrine/annotations:1.2.7" "doctrine/inflector:1.1.0" "doctrine/lexer:1.0.1" "symfony/console:2.7.51"
      - name: tests with this fork
        run: |
          run(){ vendor/bin/phpunit -c tests/travis/sqlite.travis.xml --log-junit junit-$1.xml; }; run head || true
      - name: tests with the upstream v2.4.8 library
        run: |
          git checkout "$BASE" -- lib
          run(){ vendor/bin/phpunit -c tests/travis/sqlite.travis.xml --log-junit junit-$1.xml; }; run base || true
          git checkout HEAD -- lib
      - name: compare
        run: php .github/ci/compare.php "junit-head*.xml" "junit-base*.xml"
